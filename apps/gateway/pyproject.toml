[project]
name = "transport-gateway"
version = "0.1.0"
description = "TCP gateway for transport telemetry"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "redis[hiredis]>=5.0,<6",
    "transport-contracts",
]

[tool.uv.sources]
transport-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transport_gateway"]
