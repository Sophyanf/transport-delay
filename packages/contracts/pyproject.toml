[project]
name = "transport-contracts"
version = "0.1.0"
description = "Shared contracts for Transport Delay services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transport_contracts"]
