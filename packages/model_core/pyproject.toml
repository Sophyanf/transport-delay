[project]
name = "transport-model-core"
version = "0.1.0"
description = "Replaceable model plugin system"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transport_model_core"]
